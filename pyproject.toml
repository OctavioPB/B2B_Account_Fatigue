[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harmoni"
version = "0.1.0"
description = "B2B Account Fatigue & Committee Journey Harmonizer — Revenue Intelligence & Deal Protection"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

# Core runtime deps shared across services
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# FastAPI application
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "asyncpg>=0.29",
    "redis>=5.0",
]

# Kafka ingestion layer
ingestion = [
    "confluent-kafka>=2.4",
    "fastavro>=1.9",
    "requests>=2.32",
    "faker>=25.0",
]

# Scoring and ML
scoring = [
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.4",
    "openai>=1.30",
]

# Data pipelines (Airflow + dbt)
pipelines = [
    "apache-airflow>=2.9",
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
    "dbt-clickhouse>=1.8",
    "clickhouse-driver>=0.2.8",
]

# All services combined
all = [
    "harmoni[api,ingestion,scoring,pipelines]",
]

# Development tooling
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "faker>=25.0",
]

# ---------------------------------------------------------------------------
# Ruff — formatter + linter (replaces black + flake8 + isort)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "api", "ingestion", "scoring", "orchestrator", "identity", "pipelines"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
    "ANN204",  # missing return type for __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "S106"]
"**/tests/**/*.py" = ["S101", "ANN", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["harmoni", "api", "ingestion", "scoring", "orchestrator", "identity"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["orchestrator/rl/", "pipelines/dbt/"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
    "identity/tests",
    "api/tests",
    "ingestion/tests",
]
markers = [
    "integration: requires live Docker services (deselect with -m 'not integration')",
    "smoke: liveness checks against running services",
    "unit: fast isolated tests with no external dependencies",
]
addopts = [
    "--strict-markers",
    "--tb=short",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["api", "ingestion", "scoring", "orchestrator", "identity"]
omit = [
    "*/tests/*",
    "orchestrator/rl/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

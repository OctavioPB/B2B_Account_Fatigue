# PgBouncer connection pooler configuration for harmoni
#
# Sprint 10 requirement: set up PostgreSQL connection pooling to handle
# 500 concurrent API users without exhausting pg max_connections.
#
# Architecture:
#   App servers → PgBouncer (port 6432) → PostgreSQL (port 5432)
#
# Pool sizing rationale:
#   - PostgreSQL max_connections = 200 (Terraform module default)
#   - PgBouncer keeps ≤ 180 server connections (10% headroom for admin)
#   - 500 concurrent API clients × avg 5ms query time = ~3 active server conns needed
#   - transaction mode: connection held only for duration of query, not HTTP request
#
# Deploy: docker run -v $(pwd)/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini \
#                    -v $(pwd)/userlist.txt:/etc/pgbouncer/userlist.txt \
#                    -p 6432:6432 edoburu/pgbouncer

[databases]
# Main harmoni application database
harmoni = host=postgres port=5432 dbname=harmoni

# Separate pool for Airflow — DAG connections are long-running, use session mode
harmoni_airflow = host=postgres port=5432 dbname=harmoni pool_mode=session pool_size=20

# ---------------------------------------------------------------------------
# PgBouncer settings
# ---------------------------------------------------------------------------
[pgbouncer]

# Network
listen_addr      = 0.0.0.0
listen_port      = 6432
unix_socket_dir  =

# Auth
auth_type        = md5
auth_file        = /etc/pgbouncer/userlist.txt

# Pool mode: transaction — optimal for FastAPI async handlers.
# Each async request holds a pg connection only during its query, not during
# the full HTTP request lifecycle (which includes auth, serialisation, etc.)
pool_mode        = transaction

# Connection limits
max_client_conn  = 2000    # total clients across all pools (well above 500 API users)
default_pool_size = 25     # server connections per user/db pair
min_pool_size    = 5       # keep warm connections ready
reserve_pool_size = 5      # extra connections for bursts
reserve_pool_timeout = 5.0 # seconds before trying reserve pool

# Lifecycle
server_lifetime    = 3600   # recycle server connections after 1 hour
server_idle_timeout = 600   # close idle server connections after 10 minutes
client_idle_timeout = 0     # disable (FastAPI manages its own timeouts)
server_connect_timeout = 15

# Logging (structured; shipped to Loki/Datadog via Docker logging driver)
log_connections  = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period     = 60       # emit stats every 60 seconds

# Admin interface (localhost only)
admin_users      = harmoni_admin
stats_users      = harmoni_metrics

# TLS (mandatory in production; staging can disable)
; server_tls_sslmode = require
; server_tls_ca_file = /etc/ssl/certs/rds-ca.pem

# Ignore startup parameters that confuse some ORMs (asyncpg sends extra_float_digits)
ignore_startup_parameters = extra_float_digits,options
